<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Analytics Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .fixture-item {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .fixture-item:hover {
            background-color: #f8f9fa;
            border-color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Analytics Modal Test</h1>
        
        <div class="card">
            <div class="card-header">
                <h5>Test Fixture</h5>
            </div>
            <div class="card-body">
                <div class="fixture-item p-3 border rounded" 
                     onclick="showFixtureAnalytics(1, 1, 2, 'Team A', 'Team B')">
                    <div class="row">
                        <div class="col-md-8">
                            <strong>Team A</strong> vs <strong>Team B</strong>
                        </div>
                        <div class="col-md-4 text-end">
                            <small class="text-primary">📊 Click for analytics</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Analytics Modal -->
    <div class="modal fade" id="analyticsModal" tabindex="-1" aria-labelledby="analyticsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="analyticsModalLabel">
                        <i class="fas fa-chart-line me-2"></i>Fixture Analytics
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="analyticsContent">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Test analytics function
        function showFixtureAnalytics(fixtureId, homeTeamId, awayTeamId, homeTeamName, awayTeamName) {
            console.log('Testing analytics modal:', {fixtureId, homeTeamId, awayTeamId, homeTeamName, awayTeamName});
            
            const modal = new bootstrap.Modal(document.getElementById('analyticsModal'));
            const modalTitle = document.getElementById('analyticsModalLabel');
            const analyticsContent = document.getElementById('analyticsContent');
            
            // Update modal title
            modalTitle.innerHTML = `<i class="fas fa-chart-line me-2"></i>${homeTeamName} vs ${awayTeamName} - Analytics`;
            
            // Show loading state
            analyticsContent.innerHTML = `
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading analytics...</span>
                    </div>
                </div>
            `;
            
            // Show modal
            modal.show();
            
            // Simulate API call with test data
            setTimeout(() => {
                displayTestAnalytics(homeTeamName, awayTeamName);
            }, 1000);
        }
        
        function displayTestAnalytics(homeTeamName, awayTeamName) {
            const content = document.getElementById('analyticsContent');
            
            content.innerHTML = `
                <div class="row">
                    <div class="col-12 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="fas fa-balance-scale me-2"></i>Head-to-Head Comparison</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-5">
                                        <div class="bg-light p-3 rounded">
                                            <h6 class="text-primary">${homeTeamName}</h6>
                                            <div class="d-flex justify-content-between">
                                                <span>Games Played:</span>
                                                <span class="fw-bold">10</span>
                                            </div>
                                            <div class="d-flex justify-content-between">
                                                <span>Wins:</span>
                                                <span class="fw-bold text-success">7</span>
                                            </div>
                                            <div class="d-flex justify-content-between">
                                                <span>Win Rate:</span>
                                                <span class="fw-bold">70%</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-2 text-center d-flex align-items-center justify-content-center">
                                        <div>
                                            <div class="badge bg-primary fs-6">VS</div>
                                            <div class="small text-muted mt-2">H2H: 2-1</div>
                                        </div>
                                    </div>
                                    <div class="col-md-5">
                                        <div class="bg-light p-3 rounded">
                                            <h6 class="text-info">${awayTeamName}</h6>
                                            <div class="d-flex justify-content-between">
                                                <span>Games Played:</span>
                                                <span class="fw-bold">10</span>
                                            </div>
                                            <div class="d-flex justify-content-between">
                                                <span>Wins:</span>
                                                <span class="fw-bold text-success">6</span>
                                            </div>
                                            <div class="d-flex justify-content-between">
                                                <span>Win Rate:</span>
                                                <span class="fw-bold">60%</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="fas fa-chart-line me-2"></i>Recent Form</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <strong>${homeTeamName}:</strong>
                                    <div class="mt-2">
                                        <span class="badge bg-success me-1">W</span>
                                        <span class="badge bg-success me-1">W</span>
                                        <span class="badge bg-danger me-1">L</span>
                                        <span class="badge bg-success me-1">W</span>
                                        <span class="badge bg-success me-1">W</span>
                                    </div>
                                </div>
                                <div>
                                    <strong>${awayTeamName}:</strong>
                                    <div class="mt-2">
                                        <span class="badge bg-success me-1">W</span>
                                        <span class="badge bg-danger me-1">L</span>
                                        <span class="badge bg-success me-1">W</span>
                                        <span class="badge bg-danger me-1">L</span>
                                        <span class="badge bg-success me-1">W</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="fas fa-crystal-ball me-2"></i>Match Prediction</h6>
                            </div>
                            <div class="card-body">
                                <div class="row text-center">
                                    <div class="col-4">
                                        <div class="p-3 bg-success text-white rounded">
                                            <div class="fs-4">65%</div>
                                            <div class="small">${homeTeamName} Win</div>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="p-3 bg-light rounded">
                                            <div class="fs-6">Predicted Score</div>
                                            <div class="fs-4">85-78</div>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="p-3 bg-light rounded">
                                            <div class="fs-4">35%</div>
                                            <div class="small">${awayTeamName} Win</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
